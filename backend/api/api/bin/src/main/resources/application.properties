# Puerto donde correrá tu servidor
server.port=8080

# Configuración básica de base de datos
spring.datasource.url=jdbc:postgresql://localhost:5432/medicore_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ESTA LÍNEA ES LA MÁS IMPORTANTE AHORA:
# Evita que el servidor se caiga si no encuentra una base de datos real activa
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration