# H2 en memoria: permite desarrollar sin instalar PostgreSQL
spring.datasource.url=jdbc:h2:mem:medicore;DB_CLOSE_DELAY=-1

spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

# El esquema y los datos los crea Flyway (src/main/resources/db/migration).
# 'validate' comprueba que la entidad Medicine coincide con las tablas creadas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.h2.console.enabled=true
