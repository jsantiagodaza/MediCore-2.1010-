# PostgreSQL - credenciales SOLO desde variables de entorno.
# DB_USER y DB_PASSWORD son obligatorias: si faltan, la app falla al arrancar.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/medicore_db}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Si el Postgres de Jose exige SSL, agrega al final de DB_URL:  ?sslmode=require

spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.maximum-pool-size=5

# Arranca aunque la BD no responda, para que /api/v1/health/db diga POR QUE falla
# en vez de que la aplicacion se caiga sin explicacion.
# Si prefieres que NO arranque cuando la BD este caida, borra esta linea.
spring.datasource.hikari.initialization-fail-timeout=-1
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# 'none' mientras el esquema de Jose no exista; cambialo a 'validate' despues.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false