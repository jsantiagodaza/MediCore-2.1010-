# PostgreSQL - credenciales SOLO desde variables de entorno.
# DB_USER y DB_PASSWORD son obligatorias: si faltan, la app falla al arrancar.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/medicore_db}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Si el Postgres de Jose exige SSL, agrega al final de DB_URL:  ?sslmode=require

spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway crea el esquema y carga los datos; Hibernate solo valida que coincidan.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
