# Puerto donde correra tu servidor
server.port=8080
spring.application.name=medicore-api

# Perfil por defecto: dev (H2 en memoria, no necesita PostgreSQL)
spring.profiles.active=dev

# ============================================================
#  Este archivo NO lleva datasource ni credenciales.
#
#  NO volver a poner:
#    spring.autoconfigure.exclude=...DataSourceAutoConfiguration
#  Esa linea desactiva el DataSource en TODOS los perfiles: JPA se queda
#  sin EntityManagerFactory y JdbcTemplate sin bean, asi que la aplicacion
#  no arranca y /api/v1/health/db nunca puede consultar nada.
#
#  Cada perfil define su conexion:
#    application-dev.properties  -> H2 en memoria
#    application-prod.properties -> PostgreSQL (variables de entorno)

# ============================================================
#  CORS: solo los origenes necesarios
#
#  En desarrollo el frontend de Vite corre en 5173. Para otro origen
#  (o para produccion) define la variable de entorno CORS_ALLOWED_ORIGINS
#  con la lista separada por comas.
# ============================================================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# ============================================================
#  Errores: nunca devolver detalles internos al cliente
# ============================================================
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false