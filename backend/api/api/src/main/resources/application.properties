# Puerto donde correra tu servidor
server.port=${PORT:8080}
spring.application.name=medicore-api

# Perfil por defecto: dev (H2 en memoria, no necesita PostgreSQL)
spring.profiles.active=dev

# ============================================================
#  Este archivo NO lleva datasource ni credenciales.
#
#  NO volver a poner:
#    spring.autoconfigure.exclude=...DataSourceAutoConfiguration
#  Esa linea desactiva el DataSource en TODOS los perfiles: JPA se queda
#  sin EntityManagerFactory y JdbcTemplate sin bean, asi que la aplicacion
#  no arranca y /api/v1/health/db nunca puede consultar nada.
#
#  Cada perfil define su conexion:
#    application-dev.properties  -> H2 en memoria
#    application-prod.properties -> PostgreSQL (variables de entorno)

# ============================================================
#  CORS: solo los origenes necesarios
# ============================================================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# ============================================================
#  Errores: nunca devolver detalles internos al cliente
# ============================================================
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false
server.address=${SERVER_ADDRESS:127.0.0.1}

# ============================================================
#  Correo: notificaciones de alertas por temporada (#53)
#  LAS CREDENCIALES NO VAN AQUI: salen de variables de entorno.
# ============================================================
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.provider=${MAIL_PROVIDER:smtp}
app.mail.from=${MAIL_FROM:no-reply@medicore.local}
app.mail.from-name=${MAIL_FROM_NAME:MediCore}
app.mail.max-attempts=${MAIL_MAX_ATTEMPTS:3}
app.mail.retry-delay-ms=${MAIL_RETRY_DELAY_MS:1500}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ============================================================
#  Asistente de IA (Mol) - issue #54
#  La clave NUNCA va en el repositorio ni al frontend.
# ============================================================
app.assistant.enabled=${ASSISTANT_ENABLED:false}
app.assistant.provider=${ASSISTANT_PROVIDER:none}
app.assistant.endpoint=${ASSISTANT_ENDPOINT:https://api.openai.com/v1/chat/completions}
app.assistant.api-key=${ASSISTANT_API_KEY:}
app.assistant.model=${ASSISTANT_MODEL:gpt-4o-mini}
app.assistant.max-tokens=${ASSISTANT_MAX_TOKENS:300}
app.assistant.timeout-ms=${ASSISTANT_TIMEOUT_MS:8000}

# Fuentes externas (issue #56)
app.sources.timeout-ms=${SOURCES_TIMEOUT_MS:8000}
app.sources.weather.enabled=${SOURCES_WEATHER_ENABLED:false}
app.sources.weather.url=${SOURCES_WEATHER_URL:https://api.open-meteo.com/v1/forecast}
app.sources.weather.latitude=${SOURCES_WEATHER_LAT:10.4631}
app.sources.weather.longitude=${SOURCES_WEATHER_LON:-73.2532}
app.sources.weather.city=${SOURCES_WEATHER_CITY:Valledupar}
app.sources.weather.region=${SOURCES_WEATHER_REGION:Cesar}
app.sources.weather.calor-medio=${SOURCES_WEATHER_CALOR_MEDIO:35}
app.sources.weather.calor-alto=${SOURCES_WEATHER_CALOR_ALTO:38}
app.sources.weather.frio-medio=${SOURCES_WEATHER_FRIO_MEDIO:5}
app.sources.weather.frio-alto=${SOURCES_WEATHER_FRIO_ALTO:0}
app.sources.ins.enabled=${SOURCES_INS_ENABLED:false}
app.sources.ins.url=${SOURCES_INS_URL:https://www.datos.gov.co/resource/6c9i-2w3u.json?$limit=50}