<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MediCore — Asistente informativo (prototipo)</title>
  <style>
    body{font-family:Inter,system-ui,sans-serif;margin:0;background:#f4f7fb;color:#1b2430}
    main{max-width:720px;margin:0 auto;padding:16px}
    .banner{background:#fff4d6;border:1px solid #f0c75e;border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:12px}
    #log{background:#fff;border-radius:12px;padding:12px;min-height:320px;max-height:60vh;overflow:auto;border:1px solid #dfe6ee}
    .msg{margin:8px 0;padding:10px 12px;border-radius:10px;white-space:pre-wrap;line-height:1.45}
    .me{background:#dbeafe;margin-left:15%}
    .bot{background:#eef2f6;margin-right:15%}
    .bot.emergency{background:#fde2e2;border:1px solid #e57373}
    .meta{font-size:12px;color:#5b6775;margin-top:6px}
    .meta a{color:#2563eb}
    #f{display:flex;gap:8px;margin-top:12px}
    #q{flex:1;padding:10px;border-radius:8px;border:1px solid #c4cfdb;font-size:15px}
    button{padding:10px 16px;border:0;border-radius:8px;background:#2563eb;color:#fff;font-size:15px;cursor:pointer}
    button:disabled{opacity:.6}
  </style>
</head>
<body>
<main>
  <h1>Asistente MediCore <small>(prototipo)</small></h1>
  <div class="banner">⚠️ <strong>Prototipo informativo.</strong> No diagnostica ni receta. En una emergencia llama al <strong>123</strong>.</div>
  <div id="log" aria-live="polite"></div>
  <form id="f">
    <input id="q" maxlength="1000" placeholder="Ej: ¿Para qué sirve la loratadina?" autocomplete="off" aria-label="Tu pregunta">
    <button id="b" type="submit">Enviar</button>
  </form>
</main>
<script src="js/assistant-ui.js"></script>
</body>
</html>
